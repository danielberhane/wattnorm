<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="900" viewBox="0 0 2300 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="2300" height="900" fill="#ffffff"/>

  <!-- title -->
  <text x="1150" y="88" text-anchor="middle" font-size="66" fill="#111827">Smartbuildings — Real-time pipeline</text>
  <text x="1150" y="136" text-anchor="middle" font-size="31" fill="#6B7280">every meter reading scored against what the building should draw  ·  one model, one database, one dashboard</text>
  <line x1="600" y1="172" x2="1700" y2="172" stroke="#E5E7EB" stroke-width="2"/>

  <!-- connectors (under the nodes) -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <path d="M 380 325 H 425 V 435 H 380"/>
    <path d="M 425 380 H 480"/>
    <path d="M 740 380 H 810"/>
    <path d="M 1150 380 H 1240"/>
    <path d="M 1500 380 H 1590"/>
    <path d="M 1850 380 H 1920"/>
    <path d="M 760 640 H 920"/>
  </g>
  <!-- history: store → trainer (the learning loop) -->
  <path d="M 1370 471 V 800 H 430 V 640 H 480" stroke="#9CA3AF" stroke-width="3" fill="none"/>
  <text x="1000" y="788" text-anchor="middle" font-size="24" fill="#6B7280">history</text>
  <!-- model hot-swap: registry → scorer -->
  <path d="M 1140 558 V 430" stroke="#2F7BE8" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <text x="1160" y="505" font-size="24" fill="#2F7BE8">model  @production</text>

  <circle cx="425" cy="380" r="8" fill="#111827"/>

  <!-- sources -->
  <rect x="60" y="283" width="320" height="84" rx="42" fill="#EEF2F7" stroke="#111827" stroke-width="3"/>
  <text x="220" y="337" text-anchor="middle" font-size="36" fill="#111827">Meter</text>
  <rect x="60" y="393" width="320" height="84" rx="42" fill="#EEF2F7" stroke="#111827" stroke-width="3"/>
  <text x="220" y="447" text-anchor="middle" font-size="36" fill="#111827">Open-Meteo</text>
  <text x="220" y="522" text-anchor="middle" font-size="22" fill="#6B7280">MQTT · live meter or replay of history</text>

  <!-- broker -->
  <rect x="480" y="330" width="260" height="100" rx="12" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="610" y="393" text-anchor="middle" font-size="36" fill="#111827">mosquitto</text>
  <text x="610" y="470" text-anchor="middle" font-size="22" fill="#6B7280">MQTT broker</text>

  <!-- scorer (ours) -->
  <rect x="810" y="330" width="340" height="100" rx="12" fill="#EAF2FF" stroke="#2F7BE8" stroke-width="3"/>
  <circle cx="838" cy="356" r="8" fill="none" stroke="#2F7BE8" stroke-width="3"/>
  <text x="985" y="393" text-anchor="middle" font-size="36" fill="#1D5FCC">Scorer</text>
  <text x="935" y="470" text-anchor="middle" font-size="22" fill="#6B7280">expected · band · z · CUSUM · alerts</text>

  <!-- TimescaleDB -->
  <path d="M 1240 321 a 130 16 0 0 0 260 0 v 134 a 130 16 0 0 1 -260 0 z" fill="#E6F7F0" stroke="#1E8E5A" stroke-width="3"/>
  <ellipse cx="1370" cy="321" rx="130" ry="16" fill="#E6F7F0" stroke="#1E8E5A" stroke-width="3"/>
  <text x="1370" y="392" text-anchor="middle" font-size="36" fill="#1E7A4D">TimescaleDB</text>
  <text x="1370" y="432" text-anchor="middle" font-size="20" fill="#1E7A4D" opacity="0.8">readings · scores · alerts</text>

  <!-- Grafana -->
  <rect x="1590" y="330" width="260" height="100" rx="12" fill="#FFF4DA" stroke="#D9770A" stroke-width="3"/>
  <text x="1720" y="393" text-anchor="middle" font-size="36" fill="#B8620A">Grafana</text>
  <text x="1720" y="470" text-anchor="middle" font-size="22" fill="#6B7280">dashboard · alert rules</text>

  <!-- building manager -->
  <rect x="1920" y="338" width="320" height="84" rx="42" fill="#EEF2F7" stroke="#111827" stroke-width="3"/>
  <text x="2080" y="392" text-anchor="middle" font-size="36" fill="#111827">Building manager</text>
  <text x="2080" y="470" text-anchor="middle" font-size="22" fill="#6B7280">acts on alerts · kWh · CO₂ · $</text>

  <!-- trainer (ours) -->
  <rect x="480" y="590" width="280" height="100" rx="12" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <circle cx="508" cy="616" r="8" fill="none" stroke="#2F7BE8" stroke-width="3"/>
  <text x="628" y="653" text-anchor="middle" font-size="36" fill="#111827">Trainer</text>
  <text x="620" y="730" text-anchor="middle" font-size="22" fill="#6B7280">nightly retrain · promotion gate</text>

  <!-- MLflow -->
  <path d="M 920 571 a 130 16 0 0 0 260 0 v 134 a 130 16 0 0 1 -260 0 z" fill="#EFEAFF" stroke="#7A4FD8" stroke-width="3"/>
  <ellipse cx="1050" cy="571" rx="130" ry="16" fill="#EFEAFF" stroke="#7A4FD8" stroke-width="3"/>
  <text x="1050" y="642" text-anchor="middle" font-size="36" fill="#6B3FCB">MLflow</text>
  <text x="1050" y="682" text-anchor="middle" font-size="20" fill="#6B3FCB" opacity="0.8">experiments · model registry</text>

  <!-- legend -->
  <circle cx="1600" cy="640" r="8" fill="none" stroke="#2F7BE8" stroke-width="3"/>
  <text x="1622" y="648" font-size="22" fill="#6B7280">code in this repository</text>
  <line x1="1600" y1="690" x2="1660" y2="690" stroke="#2F7BE8" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1676" y="698" font-size="22" fill="#6B7280">model hot-swap</text>
  <line x1="1600" y1="740" x2="1660" y2="740" stroke="#9CA3AF" stroke-width="3"/>
  <text x="1676" y="748" font-size="22" fill="#6B7280">history for retraining (archived files in replay mode)</text>
</svg>
