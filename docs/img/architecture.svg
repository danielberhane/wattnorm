<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="920" viewBox="0 0 2300 920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="2300" height="920" fill="#ffffff"/>

  <!-- title -->
  <text x="1150" y="90" text-anchor="middle" font-size="68" font-weight="600" fill="#111827">Wattnorm — Real-time pipeline</text>
  <text x="1150" y="140" text-anchor="middle" font-size="32" fill="#6B7280">every meter reading scored against what the building should draw  ·  one model, one database, one dashboard</text>
  <line x1="600" y1="176" x2="1700" y2="176" stroke="#E5E7EB" stroke-width="2"/>

  <!-- connectors (under the nodes) -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <path d="M 380 325 H 425 V 435 H 380"/>
    <path d="M 425 380 H 480"/>
    <path d="M 740 380 H 810"/>
    <path d="M 1150 380 H 1220"/>
    <path d="M 1520 380 H 1590"/>
    <path d="M 1850 380 H 1900"/>
    <path d="M 760 640 H 900"/>
  </g>
  <!-- history: store → trainer (the learning loop) -->
  <path d="M 1520 425 H 1556 V 810 H 430 V 640 H 480" stroke="#9CA3AF" stroke-width="3" fill="none"/>
  <text x="1300" y="798" text-anchor="middle" font-size="26" fill="#6B7280">history (file-fed today)</text>
  <!-- model hot-swap: registry → scorer -->
  <path d="M 1160 556 V 430" stroke="#2F7BE8" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <text x="1140" y="530" text-anchor="end" font-size="26" fill="#2F7BE8">model  @production</text>

  <circle cx="425" cy="380" r="8" fill="#111827"/>

  <!-- sources -->
  <rect x="60" y="283" width="320" height="84" rx="42" fill="#EEF2F7" stroke="#111827" stroke-width="3"/>
  <text x="220" y="338" text-anchor="middle" font-size="38" font-weight="600" fill="#111827">Meter</text>
  <rect x="60" y="393" width="320" height="84" rx="42" fill="#EEF2F7" stroke="#111827" stroke-width="3"/>
  <text x="220" y="448" text-anchor="middle" font-size="38" font-weight="600" fill="#111827">Open-Meteo</text>
  <text x="220" y="528" text-anchor="middle" font-size="26" fill="#6B7280">live or replayed · MQTT</text>

  <!-- broker -->
  <rect x="480" y="330" width="260" height="100" rx="12" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="610" y="394" text-anchor="middle" font-size="38" font-weight="600" fill="#111827">mosquitto</text>
  <text x="610" y="500" text-anchor="middle" font-size="26" fill="#6B7280">MQTT broker</text>

  <!-- scorer (ours) -->
  <rect x="810" y="330" width="340" height="100" rx="12" fill="#EAF2FF" stroke="#2F7BE8" stroke-width="3"/>
  <circle cx="838" cy="356" r="8" fill="none" stroke="#2F7BE8" stroke-width="3"/>
  <text x="985" y="394" text-anchor="middle" font-size="38" font-weight="600" fill="#1D5FCC">Scorer</text>
  <text x="960" y="500" text-anchor="middle" font-size="26" fill="#6B7280">expected · band · z · CUSUM</text>

  <!-- TimescaleDB -->
  <path d="M 1220 322 v 116 a 150 18 0 0 0 300 0 v -116" fill="#E6F7F0" stroke="none"/>
  <path d="M 1220 322 v 116 a 150 18 0 0 0 300 0 v -116" fill="none" stroke="#1E8E5A" stroke-width="3"/>
  <ellipse cx="1370" cy="322" rx="150" ry="18" fill="#F3FBF7" stroke="#1E8E5A" stroke-width="3"/>
  <text x="1370" y="401" text-anchor="middle" font-size="38" font-weight="600" fill="#1E7A4D">TimescaleDB</text>
  <text x="1370" y="500" text-anchor="middle" font-size="26" fill="#6B7280">readings · scores · alerts</text>

  <!-- Grafana -->
  <rect x="1590" y="330" width="260" height="100" rx="12" fill="#FFF4DA" stroke="#D9770A" stroke-width="3"/>
  <text x="1720" y="394" text-anchor="middle" font-size="38" font-weight="600" fill="#B8620A">Grafana</text>
  <text x="1720" y="500" text-anchor="middle" font-size="26" fill="#6B7280">dashboard · alert rules</text>

  <!-- building manager -->
  <rect x="1900" y="338" width="360" height="84" rx="42" fill="#EEF2F7" stroke="#111827" stroke-width="3"/>
  <text x="2080" y="393" text-anchor="middle" font-size="38" font-weight="600" fill="#111827">Building manager</text>
  <text x="2080" y="500" text-anchor="middle" font-size="26" fill="#6B7280">acts on alerts · kWh · CO₂ · $</text>

  <!-- trainer (ours) -->
  <rect x="480" y="590" width="280" height="100" rx="12" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <circle cx="508" cy="616" r="8" fill="none" stroke="#2F7BE8" stroke-width="3"/>
  <text x="628" y="654" text-anchor="middle" font-size="38" font-weight="600" fill="#111827">Trainer</text>
  <text x="620" y="738" text-anchor="middle" font-size="26" fill="#6B7280">trailing-window retrain · promotion gate</text>

  <!-- MLflow -->
  <path d="M 900 572 v 116 a 150 18 0 0 0 300 0 v -116" fill="#EFEAFF" stroke="none"/>
  <path d="M 900 572 v 116 a 150 18 0 0 0 300 0 v -116" fill="none" stroke="#7A4FD8" stroke-width="3"/>
  <ellipse cx="1050" cy="572" rx="150" ry="18" fill="#F6F2FF" stroke="#7A4FD8" stroke-width="3"/>
  <text x="1050" y="651" text-anchor="middle" font-size="38" font-weight="600" fill="#6B3FCB">MLflow</text>
  <text x="1050" y="750" text-anchor="middle" font-size="26" fill="#6B7280">experiments · model registry</text>

  <!-- legend -->
  <circle cx="1640" cy="640" r="8" fill="none" stroke="#2F7BE8" stroke-width="3"/>
  <text x="1664" y="649" font-size="26" fill="#6B7280">code in this repository</text>
  <line x1="1632" y1="694" x2="1696" y2="694" stroke="#2F7BE8" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1714" y="703" font-size="26" fill="#6B7280">model hot-swap</text>
  <line x1="1632" y1="748" x2="1696" y2="748" stroke="#9CA3AF" stroke-width="3"/>
  <text x="1714" y="757" font-size="26" fill="#6B7280">history for retraining (planned DB feed)</text>
</svg>
