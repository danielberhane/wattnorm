# All tunables live here. Runtime secrets/hosts live in .env.
paths:
  demand_csv: data/raw/demand.csv
  weather_metric_csv: data/raw/weather_data.csv
  weather_imperial_dir: data/raw/weather_imperial
  weather_parquet: data/processed/weather_openmeteo.parquet

site:
  meter_id: bldg-a
  station_id: ithaca
  lat: 42.44
  lon: -76.50
  tz: America/New_York
  freq: 15min

splits:
  train: ["2016-01-01", "2017-12-31"]
  calibrate: ["2018-01-01", "2018-12-31"]
  test: ["2019-01-01", "2019-12-31"]
  replay: ["2020-01-01", "2021-05-31"]

model:
  quantiles: [0.05, 0.5, 0.95]
  n_estimators: 800
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 50
  target_coverage: 0.90

rules:
  spike_z: 4.0
  cusum_k: 1.0  # allowance: residual wander below ~1σ is not an anomaly (tuned on 2018)
  cusum_h: 12.0  # with k=1: +2σ shift trips in 12 slots (3 h); +3σ in 6 slots (tuned on 2018)
  stuck_slots: 8
  close_after_in_band_slots: 8
  weather_stale_hours: 3
  level_halflife_days: 3  # EWMA of z tracks the building's recent level; deviations are judged against it

sustainability:
  emission_factor_kg_per_kwh: 0.25
  tariff_usd_per_kwh: 0.14
