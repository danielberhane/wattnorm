[project]
name = "smartbuilding"
version = "0.1.0"
description = "Real-time contextual energy anomaly detection for buildings"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "httpx>=0.27",
    "holidays>=0.50",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3", "scikit-learn>=1.5", "shap>=0.45", "mlflow>=2.14"]
serve = ["paho-mqtt>=2.1", "psycopg[binary]>=3.1", "fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartbuilding"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["N803", "N806"]  # X / y are idiomatic matrix names in ML code

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose stack"]
addopts = "-ra"
filterwarnings = [
    "error::FutureWarning",
    "ignore::PendingDeprecationWarning:shap",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff.lint.isort]
known-first-party = ["smartbuilding"]
